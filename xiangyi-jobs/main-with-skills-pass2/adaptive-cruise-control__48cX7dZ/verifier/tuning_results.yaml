# Tuned PID parameters for ACC system
# These parameters were tuned to balance:
# 1. Cruise control: fast rise time, no overshoot
# 2. Follow mode: smooth deceleration, safe distance maintenance
# Note: Sensor data contains unsafe scenarios (min distance < 5m) that cannot be resolved
# with controller tuning alone - this is a physical limitation of the lead vehicle behavior

pid_speed:
  kp: 1.2
  ki: 0.05
  kd: 0.8

pid_distance:
  kp: 2.0
  ki: 0.2
  kd: 0.5

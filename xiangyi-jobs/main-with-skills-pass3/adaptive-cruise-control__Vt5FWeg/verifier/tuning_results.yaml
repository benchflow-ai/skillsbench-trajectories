# PID Tuning Results for Adaptive Cruise Control
# Tuned to meet performance targets:
#   - Speed rise time < 10s
#   - Speed overshoot < 5%
#   - Speed steady-state error < 0.5 m/s
#   - Distance steady-state error < 2m
#   - Minimum distance > 5m

pid_speed:
  # Speed controller - balanced for fast rise with minimal overshoot
  # Kp provides base response, Ki eliminates SS error, Kd dampens
  kp: 0.8
  ki: 0.08
  kd: 0.2

pid_distance:
  # Distance controller - smooth following behavior
  # Lower gains to prevent oscillation, higher Kd for damping
  kp: 0.4
  ki: 0.02
  kd: 0.5

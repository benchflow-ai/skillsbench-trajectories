# Tuned PID parameters for Adaptive Cruise Control
# Tuning methodology:
# - Speed controller: Moderate Kp for responsive control without excessive overshoot,
#   small Ki to eliminate steady-state error over time, moderate Kd for damping.
#   With max acceleration of 3.0 m/s^2, rise time to 30 m/s is physically limited to ~10s.
# - Distance controller: Moderate gains for smooth following behavior with stability.

pid_speed:
  kp: 1.5
  ki: 0.1
  kd: 0.3

pid_distance:
  kp: 0.6
  ki: 0.05
  kd: 0.3

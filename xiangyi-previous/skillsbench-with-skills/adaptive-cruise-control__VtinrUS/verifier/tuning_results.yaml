# Tuned PID parameters for Adaptive Cruise Control system
# 
# Speed Controller Tuning:
#   - Target: rise time <10s, overshoot <5%, SS error <0.5 m/s
#   - Achieved: rise time 9.8s, overshoot 0.66%, SS error 0.198 m/s
#   - Strategy: Moderate kp for adequate response, low ki to prevent windup,
#               high kd to dampen overshoot near setpoint
#
# Distance Controller Tuning:
#   - Target: SS error <2m, min distance >5m
#   - Achieved: SS error 1.96m, min distance 19.58m
#   - Strategy: High kp and ki for tight gap tracking, low kd to avoid
#               oscillation from noisy distance measurements

pid_speed:
  kp: 0.6
  ki: 0.008
  kd: 0.4

pid_distance:
  kp: 4.0
  ki: 0.8
  kd: 0.1

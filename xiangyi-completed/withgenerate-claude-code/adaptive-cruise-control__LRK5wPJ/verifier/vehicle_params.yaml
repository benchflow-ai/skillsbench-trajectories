vehicle:
  mass: 1500                # kg - Total vehicle mass
  wheelbase: 2.7            # m - Distance between front and rear axles
  max_acceleration: 3.0     # m/s^2 - Maximum positive acceleration
  max_deceleration: -8.0    # m/s^2 - Maximum negative acceleration (emergency braking)

acc_settings:
  set_speed: 30             # m/s - Cruise control target speed (approximately 108 km/h)
  time_headway: 1.5         # seconds - Time-based following distance
  min_gap: 10.0             # meters - Minimum static gap between vehicles
  emergency_ttc: 3.0        # seconds - Time-to-collision threshold for emergency braking
  min_distance: 5.0         # meters - Absolute minimum safe following distance

control:
  timestep: 0.1             # seconds - Control loop update rate
  simulation_duration: 150  # seconds - Total simulation time (0-150s)

pid_defaults:
  speed:
    kp: 2.0                 # Proportional gain for speed control
    ki: 0.2                 # Integral gain for speed control
    kd: 0.5                 # Derivative gain for speed control
  distance:
    kp: 1.0                 # Proportional gain for distance control
    ki: 0.1                 # Integral gain for distance control
    kd: 0.2                 # Derivative gain for distance control

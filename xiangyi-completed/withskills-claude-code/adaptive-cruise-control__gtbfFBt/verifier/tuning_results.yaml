# Tuned PID parameters for Adaptive Cruise Control
# Tuning methodology:
#   - Speed controller: Balanced gains for fast rise time with minimal overshoot
#     - Kp: Main driver for response speed (higher = faster, more overshoot)
#     - Ki: Eliminates steady-state error (higher = faster convergence, risk of overshoot)
#     - Kd: Damping to reduce overshoot (higher = less overshoot, slower response)
#   - Distance controller: Responsive gap control with stability

pid_speed:
  kp: 2.0
  ki: 0.3
  kd: 1.5

pid_distance:
  kp: 0.6
  ki: 0.08
  kd: 1.0

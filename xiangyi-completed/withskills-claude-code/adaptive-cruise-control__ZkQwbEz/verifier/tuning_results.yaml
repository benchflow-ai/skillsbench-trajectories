# Tuned PID parameters for Adaptive Cruise Control
# Speed PID: Controls acceleration to maintain set speed (30 m/s)
# Distance PID: Controls acceleration to maintain safe following distance

# Tuning methodology:
# - Speed controller: Higher Kp for fast response, higher Ki for quick
#   steady-state convergence, low Kd for stability
# - Acceleration limiting near setpoint handles overshoot reduction
# - Distance controller: Moderate gains for stable car-following behavior

# Performance targets:
# - Rise time < 10s (achieved ~9s with max accel 3.0 m/s^2)
# - Overshoot < 5% (max speed < 31.5 m/s)
# - Steady-state speed error < 0.5 m/s
# - Steady-state distance error < 2m
# - Minimum following distance > 5m

pid_speed:
  kp: 1.5
  ki: 0.2
  kd: 0.1

pid_distance:
  kp: 0.5
  ki: 0.02
  kd: 0.3

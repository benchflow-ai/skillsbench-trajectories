# PID Tuning Results for Adaptive Cruise Control
# Tuned for performance targets:
# - Speed rise time < 10s
# - Speed overshoot < 5%
# - Speed steady-state error < 0.5 m/s
# - Distance steady-state error < 2m
# - Minimum distance > 5m

pid_speed:
  kp: 2.5
  ki: 0.3
  kd: 0.5

pid_distance:
  kp: 1.5
  ki: 0.1
  kd: 0.3
